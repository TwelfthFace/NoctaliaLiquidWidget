id = "danta/liquidctl-control"
name = "Liquidctl Control"
version = "0.1.2"
min_noctalia = "5.0.0"
author = "danta"
license = "MIT"
dependencies = []
tags = ["hardware", "monitoring", "rgb", "cooling"]
icon = "droplet"
description = "Monitor Commander Pro coolant, radiator fan and pump speeds, and control Commander Pro and ASUS Aura lighting."
plugin_api = 30

[[widget]]
id = "cooling"
entry = "widget.luau"

  [[widget.setting]]
  key = "display_mode"
  type = "select"
  label_key = "settings.widget.entry-0.display-mode.label"
  description_key = "settings.widget.entry-0.display-mode.description"
  default = "full"
  options = [
    { value = "full", label_key = "settings.widget.entry-0.display-mode.options.option-0" },
    { value = "compact", label_key = "settings.widget.entry-0.display-mode.options.option-1" },
  ]

[[service]]
id = "controller"
entry = "service.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 520
height = 650
placement = "floating"
position = "center"

[[setting]]
key = "liquidctl_path"
type = "string"
label_key = "settings.liquidctl-path.label"
description_key = "settings.liquidctl-path.description"
default = "liquidctl"

[[setting]]
key = "commander_match"
type = "string"
label_key = "settings.commander-match.label"
description_key = "settings.commander-match.description"
default = "Commander PRO"

[[setting]]
key = "aura_match"
type = "string"
label_key = "settings.aura-match.label"
description_key = "settings.aura-match.description"
default = "ASUS Aura LED Controller"

[[setting]]
key = "aura_pick"
type = "int"
label_key = "settings.aura-pick.label"
description_key = "settings.aura-pick.description"
default = 0
min = 0
max = 16
step = 1

[[setting]]
key = "aura_channel"
type = "select"
label_key = "settings.aura-channel.label"
description_key = "settings.aura-channel.description"
default = "sync"
options = [
  { value = "sync", label_key = "settings.aura-channel.options.option-0" },
  { value = "led1", label_key = "settings.aura-channel.options.option-1" },
  { value = "led2", label_key = "settings.aura-channel.options.option-2" },
  { value = "led3", label_key = "settings.aura-channel.options.option-3" },
  { value = "led4", label_key = "settings.aura-channel.options.option-4" },
]

[[setting]]
key = "temperature_sensor"
type = "int"
label_key = "settings.temperature-sensor.label"
description_key = "settings.temperature-sensor.description"
default = 1
min = 1
max = 4
step = 1

[[setting]]
key = "poll_interval_ms"
type = "int"
label_key = "settings.poll-interval-ms.label"
description_key = "settings.poll-interval-ms.description"
default = 2000
min = 1000
max = 30000
step = 500

[[setting]]
key = "privilege_mode"
type = "select"
label_key = "settings.privilege-mode.label"
description_key = "settings.privilege-mode.description"
default = "direct"
options = [
  { value = "direct", label_key = "settings.privilege-mode.options.option-0" },
  { value = "pkexec", label_key = "settings.privilege-mode.options.option-1" },
  { value = "sudo-n", label_key = "settings.privilege-mode.options.option-2" },
]

[[setting]]
key = "commander_lighting_enabled"
type = "bool"
label_key = "settings.commander-lighting-enabled.label"
description_key = "settings.commander-lighting-enabled.description"
default = true

[[setting]]
key = "aura_lighting_enabled"
type = "bool"
label_key = "settings.aura-lighting-enabled.label"
description_key = "settings.aura-lighting-enabled.description"
default = true
